# Cloudflare Pages · site vitrine Bureau des Légendes (bdl.workplay.fr)
name = "bureau-des-legendes"
pages_build_output_dir = "."
compatibility_date = "2025-09-01"
# process.env et Buffer disponibles dans les fonctions (code partagé avec Netlify)
compatibility_flags = ["nodejs_compat"]

# Alerte e-mail à l'entrée d'un invité : Worker « bdl-notif » (outils/notif-worker/worker.js)
[[services]]
binding = "NOTIF"
service = "bdl-notif"
